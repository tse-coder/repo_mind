[project]
name = "repomind"
version = "0.1.0"
description = "An autonomous, read-only repository investigation agent powered by LangGraph and Google Gemini."
requires-python = ">=3.11"
dependencies = [
    # LangGraph & LangChain
    "langgraph>=0.4.0",
    "langchain-core>=0.3.0",
    "langchain-google-genai>=2.1.0",
    # Vector store & embeddings
    "chromadb>=0.5.0",
    "fastembed>=0.4.0",
    # Backend API
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sse-starlette>=2.0.0",
    "pydantic>=2.0.0",
    # Utilities
    "python-dotenv>=1.0.0",
    "langchain-groq>=1.1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
